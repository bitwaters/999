services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CONTAINERIZED_RUN: ${CONTAINERIZED_RUN:-0}
      BUILD_GIT_COMMIT: ${BUILD_GIT_COMMIT:-unknown}
      BUILD_WORKTREE_STATUS: ${BUILD_WORKTREE_STATUS:-unknown}
      RUNTIME_HEALTH_REQUIRED: '1'
    command: ['node', 'dist/app/main.js']
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', 'dist/app/healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp

  sampler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'scripts/continuous-sampler.mjs']
    env_file:
      - path: .env
        required: false
    volumes:
      - sampling-data:/app/sampling-data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs = require('node:fs'); const p = '/app/sampling-data/status.json';
          const s = JSON.parse(fs.readFileSync(p, 'utf8')); if (s.state !== 'running'
          || Date.now() - Date.parse(s.updated_at) > 180000) process.exit(1);
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bot-data:
  sampling-data:
